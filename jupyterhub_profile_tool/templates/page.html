<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>
      JupyterHub - Profile Tool
    </title>
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
          href="/hub/static/css/style.min.css"
          type="text/css" />
    <link rel="icon" href="/hub/static/favicon.ico" type="image/x-icon">
    <meta name="description" content="JupyterHub - Profile Tool">
    <meta name="keywords" content="Jupyter, JupyterHub, Profiles, SlurmSpawner">
  </head>
  <body>
    <noscript>
      <div id='noscript'>
        JupyterHub requires JavaScript.
        <br>
        Please enable it to proceed.
      </div>
    </noscript>
    <nav class="navbar navbar-expand-sm bg-body-tertiary mb-4">
      <div class="container-fluid">
        <span id="jupyterhub-logo" class="navbar-brand">
          <a href="{{ base_url }}">
            <img src='{{ base_url }}logo'
                  alt='JupyterHub logo'
                  class='jpy-logo'
                  title='Home' />
          </a>
        </span>
        <div class="collapse navbar-collapse" id="thenavbar">
          <ul class="navbar-nav me-auto mb-0">
            {% if user %}
              {% block nav_bar_left_items %}
                <li class="nav-item">
                  <a class="nav-link" href="{{ base_url }}home">Home</a>
                </li>
              {% end %}
            {% end %}
          </ul>
          <ul class="nav navbar-nav me-2">
            {% block nav_bar_right_items %}
              <li class="nav-item">
                {% block theme_toggle %}
                  <button class="btn btn-sm"
                          id="dark-theme-toggle"
                          aria-label="Toggle dark mode"
                          title="Toggle dark mode">
                    <i aria-hidden="true" class="fa fa-circle-half-stroke"></i>
                  </button>
                {% end %}
              </li>
              {% if user %}
                <li class="nav-item">
                  <span id="login_widget">
                    <span class="me-1">{{ user }}</span>
                    <a id="logout"
                       role="button"
                       class="btn btn-sm btn-outline-contrast"
                       href="{{ base_url }}logout"> <i aria-hidden="true" class="fa fa-sign-out"></i>Logout</a>
                  </span>
                </li>
              {% end %}
            {% end %}
          </ul>
        </div>
      </div>
    </nav>
    <div class="container">
      <div class="row text-center">
        <h1>Profile Maker</h1>
      </div>
      <div class="row justify-content-center">
        <div class="col-md-8">
          <label for="profileSelect">Select a job profile:</label>
          <select class="form-control" id="profileSelect" required autofocus>
            {% if len(profiles) > 0 %}
              {% for profile in profiles %}
                <option value="{{ profile['profile_id'] }}" {% if profile['profile_id'] == selected_profile %}selected{% end %}>
                  {{ profile['description'] }}
                </option>
              {% end %}
            {% else %}
              <option value="no-profile" selected>No user profiles found</option>
            {% end %}
          </select>
          <br>
          <div class="feedback-container">
            <button id="btnNew" class="btn btn-jupyter">New Profile</button>
            <button id="btnEdit" class="btn btn-jupyter{% if len(profiles) == 0 %} hidden{% end %}">Edit Profile</button>
            <button id="btnDelete" class="btn btn-jupyter{% if len(profiles) == 0 %} hidden{% end %}">Delete Profile</button>
          </div>
        </div>
      </div>
      <br>
      <div id="formSection" class="form-section hidden">
        <div class="row text-center">
          <h2 id="formTitle"></h2>
        </div>
        <form id="profileForm">
          <div class="form-group">
            <label for="description">Profile description:</label>
            <input id="description"
                   name="description"
                   type="text"
                   value="New Profile"
                   title="Description which will appear in profile selection drop-downs. Ensuring understandability and uniqueness is users' responsibility.">
          </div>
          <br>
          <div class="form-group">
            <label for="options.req_partition">Profile description:</label>
            <select id="options.req_partition"
                    name="options.req_partition">
              <option value="slowlane" selected>Slurm partition 'slowlane'</option>
              <option value="fastlane">Slurm partition 'fastlane'</option>
            </select>
          </div>
          <br>
          <div class="form-group">
            <label for="options.req_runtime">Max. Runtime:</label>
            <input id="options.req_runtime"
                   name="options.req_runtime"
                   type="text"
                   pattern="^([0-9]-)?[0-9]{2}:[0-9]{2}:[0-9]{2}$"
                   value="01:00:00"
                   title="Profile's maximum runtime. Accepted formats: hh:mm:ss or d-hh:mm:ss">
          </div>
          <div class="form-group">
            <label for="options.req_nprocs">CPU cores:</label>
            <input id="options.req_nprocs"
                   name="options.req_nprocs"
                   type="number"
                   min="1"
                   max="128"
                   value="1"
                   title="Profile's CPU core limit">
          </div>
          <div class="form-group">
            <label for="options.req_memory">Memory:</label>
            <input id="options.req_memory"
                   name="options.req_memory"
                   type="text"
                   pattern="^[0-9]+\s*[kKmMgGtT]?[bB]?$"
                   value="1 GB"
                   title="Profile's memory (RAM) limit. Can include units. If no unit is set, Slurm assumes bytes">
          </div>
          <div class="form-group">
            <label for="options.req_gres">GRES:</label>
            <input id="options.req_gres"
                   name="options.req_gres"
                   type="text"
                   pattern="^(gpu:((A40:)|(A100:))?[1-8])?$"
                   value=""
                   title="Generalized Resources. Currently only supports GPU spec. Either general (gpu:#amount) or specific type (gpu:A40:#amount or gpu:A100:#amount). Leave empty to run without GPUs">
          </div>
          <div class="feedback-container">
            <button type="submit" class="btn btn-jupyter">Submit</button>
          </div>
        </form>
      </div>
    </div>
    <script>
      const profileSelect = document.getElementById("profileSelect");
      const btnNew = document.getElementById("btnNew");
      const btnEdit = document.getElementById("btnEdit");
      const btnDelete = document.getElementById("btnDelete");
      const formSection = document.getElementById("formSection");
      const formTitle = document.getElementById("formTitle");
      const profileForm = document.getElementById("profileForm");
      let selectedId = "";

      function formDataToObject(form) {
        const formValues = Object.fromEntries(new FormData(form).entries());
        const result = {};

        for (const [key, value] of Object.entries(formValues)) {
          if (key.includes(".")) {
            // Split nach Punkten: address.street → result.address.street
            const parts = key.split(".");
            let target = result;
            while (parts.length > 1) {
              const part = parts.shift();
              target[part] = target[part] || {};
              target = target[part];
            }
            target[parts[0]] = value;
          } else {
            result[key] = value;
          }
        }
        return result
      }

      function fillForm(data, form) {
        for (const [key, value] of Object.entries(flattenObject(data))) {
          const input = form.querySelector(`[id="${key}"]`);
          if (input) input.value = value;
        }
      }

      function flattenObject(obj, parentKey = "", res = {}) {
        for (let [k, v] of Object.entries(obj)) {
          const newKey = parentKey ? parentKey + "." + k : k;
          if (v && typeof v === "object" && !Array.isArray(v)) {
            flattenObject(v, newKey, res);
          } else {
            res[newKey] = v;
          }
        }
        return res;
      }

      function getXsrfToken() {
        const match = document.cookie.match("\\b_xsrf=([^;]*)\\b");
        return match ? match[1] : null;
      }

      function normalizeMemSize(input) {
        if (!input) return "";
        let value = input.replace(/\s+/g, "").toUpperCase().replace("B","");
        return value;
      }

      btnNew.addEventListener("click", () => {
        selectedId = "";
        formTitle.textContent = "New Profile";
        formSection.classList.remove("hidden");
        profileForm.reset();
      });

      btnEdit.addEventListener("click", () => {
        selectedId = profileSelect.value;
        if (!selectedId) return;

        fetch(`{{ prefix }}profiles/${selectedId}/data`)
          .then(res => res.json())
          .then(data => {
            formTitle.textContent = "Change Profile";
            formSection.classList.remove("hidden");

            // Formular mit allen (auch verschachtelten) Feldern füllen
            fillForm(data, profileForm);
          });
      });

      btnDelete.addEventListener("click", () => {
        selectedId = profileSelect.value;
        if (!selectedId) return;
        if (!confirm("Are you sure to delete this profile?")) return;

        fetch(`{{ prefix }}profiles/${selectedId}/delete`, {
          method: "POST",
          headers: { "X-XSRFToken": getXsrfToken() },
          credentials: "same-origin"
        })
        .then(() => window.location.reload());
      });

      profileForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const structuredData = formDataToObject(profileForm);

        if (structuredData.options.req_memory) {
          structuredData.options.req_memory = normalizeMemSize(structuredData.options.req_memory)
        }

        const isNew = selectedId === "";
        const url = isNew
          ? "{{ prefix }}profiles/create"
          : `{{ prefix }}profiles/${selectedId}/update`;

        fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-XSRFToken": getXsrfToken()
          },
          credentials: "same-origin",
          body: JSON.stringify(structuredData)
        })
        .then(() => window.location.reload());
      });
    </script>
  </body>
</html>
